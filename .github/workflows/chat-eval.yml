name: Chat eval (live model)

# Automated replacement for the manual "type X into chat, expect Y" checklist.
# Sends the key scenarios to the real model with the production prompt and
# asserts it makes the right decision (commit vs ask vs propose vs decline).
#
# This costs a few Anthropic tokens per run and is mildly non-deterministic, so
# it is MANUAL-ONLY — run it from the Actions tab via the "Run workflow" button.
# No schedule, so it never spends tokens on its own. It needs an ANTHROPIC_API_KEY
# repository secret; without it the eval skips and the job stays green.

on:
  workflow_dispatch: {}

jobs:
  chat-eval:
    name: live chat behaviour eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run chat behaviour eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval:chat
