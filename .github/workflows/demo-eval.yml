name: Demo read eval (live, end-to-end)

# Read-only end-to-end Q&A against the seeded demo account: signs in (reseeding
# the deterministic "Alex" portfolio) and asks questions through the real
# /api/chat, asserting answers contain the known seeded values. Exercises the
# full path — auth → database context → model → answer.
#
# READ-ONLY: it only asks questions, never writes, so it can't corrupt the shared
# demo account. Hits the deployed app (the server holds the demo creds + Anthropic
# key); set the APP_BASE_URL repository variable to override the default. Skips
# cleanly if the demo session is unavailable, and never fails on a 429.
#
# MANUAL-ONLY — run it from the Actions tab via the "Run workflow" button. No
# schedule, so it never spends tokens or the demo account's daily chat budget on
# its own. Separate from the model eval so each can be triggered independently.

on:
  workflow_dispatch: {}

jobs:
  demo-eval:
    name: demo read Q&A
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run demo read Q&A
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://app.volnar.nl' }}
        run: npm run eval:demo
