name: CI

# Runs the deterministic behaviour suite and a full typecheck on every push to
# main and every pull request, so a change that breaks an intended behaviour of
# the chat or the app fails the check before it can ship. Both steps are
# hermetic — no network, database, AI provider, or secrets required.

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + behaviour tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Behaviour tests
        run: npm test
