<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volnar — Asset detail (Static)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">

  <style>
    :root, [data-theme="light"] {
      --bg: #F5F1EA;
      --surface: #FFFFFF;
      --surface-elev: #EBE4D6;
      --border: rgba(26, 31, 46, 0.08);
      --border-strong: rgba(26, 31, 46, 0.16);
      --text: #1A1F2E;
      --text-dim: #6B7280;
      --text-faint: #9CA3AF;
      --hero: #0B0F18;
      --accent: #4A7C5E;
      --accent-soft: #DDEBE1;
      --accent-text: #2D5340;
      --positive: #4A7C5E;
      --positive-soft: #DDEBE1;
      --positive-text: #2D5340;
      --negative: #B5564B;
      --negative-soft: #F4DDD9;
      --negative-text: #8B3D33;
      --font-sans: 'Albert Sans', -apple-system, system-ui, sans-serif;
      --font-serif: 'Source Serif 4', Georgia, serif;
      --nav-surface: rgba(245, 241, 234, 0.92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #2A2A2C;
      min-height: 100vh;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .phone {
      width: 390px;
      height: 844px;
      background: #0A0A0A;
      border-radius: 56px;
      padding: 12px;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.5);
      position: relative;
    }
    .phone::before {
      content: '';
      position: absolute;
      top: 22px; left: 50%;
      transform: translateX(-50%);
      width: 110px; height: 30px;
      background: #000; border-radius: 16px; z-index: 10;
    }

    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--text);
    }

    .status-bar {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px 6px;
      font-size: 15px;
      font-weight: 600;
    }
    .status-bar .right { display: flex; gap: 6px; align-items: center; }

    .app {
      flex: 1;
      overflow-y: auto;
      padding: 0 22px 110px;
      scrollbar-width: none;
    }
    .app::-webkit-scrollbar { display: none; }

    /* TOP BAR — back only (no refresh, no live data) */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 14px 0 18px;
    }
    .back-btn {
      width: 36px; height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: -8px;
      color: var(--text);
      cursor: pointer;
    }
    .back-btn svg { width: 22px; height: 22px; }

    /* IDENTITY */
    .identity-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .asset-logo {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: var(--surface);
      border: 0.5px solid var(--border-strong);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .asset-logo img {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .asset-name {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 500;
      color: var(--hero);
      letter-spacing: -0.01em;
      line-height: 1.05;
      font-variation-settings: 'opsz' 24;
    }

    /* BALANCE HERO */
    .balance-hero {
      margin-bottom: 30px;
    }
    .hero-eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 8px;
    }
    .hero-value {
      font-family: var(--font-serif);
      font-size: 48px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--hero);
      line-height: 1;
      font-feature-settings: "tnum" 1;
      font-variation-settings: 'opsz' 60;
      margin-bottom: 10px;
    }
    .hero-value .currency {
      color: var(--text-faint);
      font-weight: 500;
      margin-right: 2px;
    }
    .change-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      font-feature-settings: "tnum" 1;
    }
    .change-pill.positive {
      background: var(--positive-soft);
      color: var(--positive-text);
    }
    .change-pill.negative {
      background: var(--negative-soft);
      color: var(--negative-text);
    }
    .change-pill svg {
      width: 11px; height: 11px;
    }

    /* SECTION LABEL */
    .section-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 12px;
    }

    /* ACTIVITY */
    .activity-row {
      display: flex;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
    }
    .activity-row:last-child { border-bottom: none; }
    .activity-date {
      font-size: 12px;
      color: var(--text-faint);
      font-feature-settings: "tnum" 1;
      width: 60px;
      flex-shrink: 0;
      padding-top: 1px;
    }
    .activity-body {
      flex: 1;
      min-width: 0;
    }
    .activity-delta {
      font-size: 14px;
      font-weight: 500;
      color: var(--positive-text);
      margin-bottom: 2px;
    }
    .activity-delta.negative { color: var(--negative-text); }
    .activity-delta.neutral { color: var(--text); }
    .activity-note {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.4;
      font-variation-settings: 'opsz' 14;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--nav-surface);
      backdrop-filter: blur(20px);
      border-top: 0.5px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 14px 0 32px;
      border-radius: 0 0 44px 44px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-faint);
      flex: 1;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item svg { width: 26px; height: 26px; display: block; }
    .nav-item span { font-size: 11px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="screen">

        <div class="status-bar">
          <span>9:41</span>
          <span class="right">
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M232,40H184a16,16,0,0,0-16,16V200a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V56A16,16,0,0,0,232,40Zm0,160H184V56h48ZM152,80h-48a16,16,0,0,0-16,16V200a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V96A16,16,0,0,0,152,80Zm0,120h-48V96h48ZM72,128H24a16,16,0,0,0-16,16v56a16,16,0,0,0,16,16H72a16,16,0,0,0,16-16V144A16,16,0,0,0,72,128Zm0,72H24V144H72Z"/></svg>
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M140,204a12,12,0,1,1-12-12A12,12,0,0,1,140,204ZM237.08,87A172,172,0,0,0,18.92,87,8,8,0,0,0,29.08,99.37a156,156,0,0,1,197.84,0A8,8,0,1,0,237.08,87ZM205.78,124.9a124,124,0,0,0-155.56,0A8,8,0,1,0,60.18,137.4a108,108,0,0,1,135.64,0,8,8,0,1,0,9.96-12.5Zm-30.79,38.1a76,76,0,0,0-93.98,0A8,8,0,1,0,90.81,175.5a60,60,0,0,1,74.38,0A8,8,0,1,0,174.99,163Z"/></svg>
            <svg width="22" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,72H32A16,16,0,0,0,16,88v80a16,16,0,0,0,16,16H224a16,16,0,0,0,16-16V152h8a8,8,0,0,0,8-8V112a8,8,0,0,0-8-8h-8V88A16,16,0,0,0,224,72ZM224,168H32V88H224V168Z"/><rect x="40" y="96" width="160" height="64" rx="2"/></svg>
          </span>
        </div>

        <div class="app">

          <!-- Top bar — back only -->
          <div class="top-bar">
            <div class="back-btn">
              <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="160 208 80 128 160 48"/>
              </svg>
            </div>
          </div>

          <!-- Identity -->
          <div class="identity-header">
            <div class="asset-logo">
              <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-dim); width: 26px; height: 26px;">
                <path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a8,8,0,0,0,8-8V80A8,8,0,0,0,216,72Z"/>
                <circle cx="180" cy="144" r="12" fill="currentColor"/>
              </svg>
            </div>
            <div class="asset-name">Emergency fund</div>
          </div>

          <!-- Balance hero -->
          <div class="balance-hero">
            <div class="hero-eyebrow">Balance</div>
            <div class="hero-value"><span class="currency">€</span>18,400</div>
            <div class="change-pill positive">
              <svg viewBox="0 0 256 256" fill="currentColor"><path d="M216,72v96a8,8,0,0,1-8,8H112a8,8,0,0,1-5.66-13.66L208,60.69Z"/></svg>
              +€2,500 this year
            </div>
          </div>

          <!-- Activity -->
          <div class="section-label">Activity</div>

          <div class="activity-row">
            <div class="activity-date">15 Apr</div>
            <div class="activity-body">
              <div class="activity-delta">+€2,500</div>
              <div class="activity-note">Q1 bonus, topped up to target.</div>
            </div>
          </div>

          <div class="activity-row">
            <div class="activity-date">8 Feb</div>
            <div class="activity-body">
              <div class="activity-delta negative">−€1,500</div>
              <div class="activity-note">Emergency car repair — exactly what this is for.</div>
            </div>
          </div>

          <div class="activity-row">
            <div class="activity-date">12 Nov 2024</div>
            <div class="activity-body">
              <div class="activity-delta">+€3,000</div>
              <div class="activity-note">Year-end contribution, bringing back to 6 months coverage.</div>
            </div>
          </div>

        </div>

        <div class="bottom-nav">
          <div class="nav-item active">
            <svg viewBox="0 0 256 256" fill="currentColor">
              <circle cx="128" cy="128" r="96" fill="none" stroke="currentColor" stroke-width="14"/>
              <line x1="128" y1="32" x2="128" y2="128" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
              <line x1="211.27" y1="80" x2="128" y2="128" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
            </svg>
            <span>Portfolio</span>
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
              <rect x="40" y="40" width="176" height="176" rx="8"/>
              <line x1="176" y1="24" x2="176" y2="56"/>
              <line x1="80" y1="24" x2="80" y2="56"/>
              <line x1="40" y1="88" x2="216" y2="88"/>
            </svg>
            <span>Diary</span>
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
              <path d="M232,128A104,104,0,0,1,79.12,219.82L45.07,231.17a16,16,0,0,1-20.24-20.24l11.35-34.05A104,104,0,1,1,232,128Z"/>
            </svg>
            <span>Chat</span>
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="128" cy="96" r="64"/>
              <path d="M30.99,224a112.04,112.04,0,0,1,194.02,0"/>
            </svg>
            <span>Profile</span>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
